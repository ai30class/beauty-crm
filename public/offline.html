<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>離線中 — 美業管家</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang TC', sans-serif;
      background: #fff5f7;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 48px 32px;
      text-align: center;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(232,120,154,0.08);
    }
    .icon { font-size: 64px; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 700; color: #2d2d2d; margin-bottom: 8px; }
    p  { font-size: 14px; color: #9a8890; line-height: 1.6; margin-bottom: 28px; }
    button {
      background: #e8789a;
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🌸</div>
    <h1>目前沒有網路連線</h1>
    <p>請確認您的網路連線後再試一次，<br>您的資料都已安全保存在雲端。</p>
    <button onclick="location.reload()">重新整理</button>
  </div>
</body>
</html>
